# Render Blueprint: one-click deploy of AgentForge AI as a single web service.
# Deploy: https://render.com/deploy?repo=https://github.com/nikhilsireesh/agentforge-ai
#
# Defaults are safe for a public demo: mock LLM mode (no API key, no cost) and the
# test sandbox disabled (no Docker inside the host). The free plan has no persistent
# disk, so the SQLite data resets when the service restarts or sleeps.
services:
  - type: web
    name: agentforge-ai
    runtime: docker
    dockerfilePath: ./docker/render.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SANDBOX_MODE
        value: disabled
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: JWT_SECRET
        generateValue: true
